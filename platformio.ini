; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Голий `pio run` збирає лише прошивки. native — середовище тестів, окремої
; програми в ньому немає, тому лінкування впало б на відсутньому main().
[platformio]
default_envs = esp32doit-devkit-v1, diag, measure, tester

; Спільні налаштування для прошивок плати. Не в [env], бо [env] успадковує
; ще й native-середовище тестів, а йому board не потрібен і ламає збірку.
[esp32_base]
platform = espressif32
board = esp32doit-devkit-v1

framework = arduino
monitor_speed = 115200

; Бібліотеки дисплея потрібні лише прошивкам з дисплеєм; вимірювальне ядро
; має тільки Wire та Preferences з фреймворку.
[display_libs]
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
    adafruit/Adafruit BusIO@^1.16.1

; Робоча прошивка дисплея
[env:esp32doit-devkit-v1]
extends = esp32_base
lib_deps = ${display_libs.lib_deps}
build_src_filter = -<*> +<main.cpp>

; Діагностика дисплея та SD:  pio run -e diag -t upload
[env:diag]
extends = esp32_base
lib_deps = ${display_libs.lib_deps}
build_src_filter = -<*> +<diag.cpp>

; Етап 1 (ТЗ §75): вимірювальне ядро без дисплея, SD та Wi-Fi.
;   pio run -e measure -t upload && pio device monitor
[env:measure]
extends = esp32_base
build_src_filter = -<*> +<main_measure.cpp> +<measurement/> +<ui/console.cpp>
build_flags = -Iinclude

; Етап 2 (ТЗ §75): ядро + TFT. Ті самі модулі measurement/, плюс Display Task.
;   pio run -e tester -t upload && pio device monitor
[env:tester]
extends = esp32_base
lib_deps = ${display_libs.lib_deps}
build_src_filter = -<*> +<main_tester.cpp> +<measurement/> +<ui/> +<storage/> +<system/>
build_flags = -Iinclude

; Тести інтегратора на хості (без плати):  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes            ; без цього pio test не бере нічого з src/
build_src_filter = -<*> +<measurement/integration.cpp>
build_flags = -Iinclude -std=gnu++17
